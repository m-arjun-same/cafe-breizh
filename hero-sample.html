<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMPLE — Café Breizh Cymatic Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEFE3; --bg2:#E7E4D2; --ink:#60150D; --muted:rgba(96,21,13,.55);
    --line:rgba(96,21,13,.42); --pill:rgba(255,255,255,.35);
  }
  body.dark{ --bg:#22100B; --bg2:#170906; --ink:#EFEFE3; --muted:rgba(239,239,227,.55); --line:rgba(239,239,227,.42); --pill:rgba(0,0,0,.25); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Source Sans 3",Arial,sans-serif; color:var(--ink); overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 42%, #fff 0%, var(--bg) 55%, var(--bg2) 100%);
    transition:background .5s;
  }
  body.dark{background:radial-gradient(120% 90% at 50% 42%, #3A1710 0%, var(--bg) 60%, var(--bg2) 100%)}
  body::after{ /* fine speckle, like the reference */
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:radial-gradient(rgba(96,21,13,.16) 1px, transparent 1px);
    background-size:9px 9px; mix-blend-mode:multiply;
  }
  body.dark::after{background-image:radial-gradient(rgba(239,239,227,.14) 1px, transparent 1px); mix-blend-mode:screen}
  .stage{position:fixed; inset:0}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  .no-gl canvas{display:none}

  header{position:absolute; top:0; left:0; right:0; z-index:5; display:flex; align-items:flex-start; padding:24px 36px;}
  .brand{display:flex; align-items:center; gap:14px; font-family:Archivo,sans-serif; font-weight:900; font-size:24px; letter-spacing:.22em}
  .brand svg{width:20px; height:20px; fill:var(--ink)}
  .controls{position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:10px}
  .pill{
    font:inherit; font-size:15px; color:var(--ink); background:var(--pill);
    border:1px solid var(--line); border-radius:99px; padding:10px 20px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap; backdrop-filter:blur(3px);
  }
  .pill:hover{border-color:var(--ink)}
  .pill.is-off{opacity:.45}
  .theme{margin-left:auto}

  .note-l{position:absolute; left:36px; top:37%; z-index:4; font-size:16px; line-height:1.45; color:var(--muted)}
  .note-r{position:absolute; right:36px; top:33%; z-index:4; text-align:right; font-size:13px; letter-spacing:.18em; line-height:1.7; color:var(--muted); text-transform:uppercase}
  .forms{position:absolute; right:36px; top:43%; z-index:5; display:flex; flex-direction:column; align-items:flex-end; gap:10px}
  .forms button{
    font:inherit; font-size:16.5px; color:var(--ink); background:none; border:1px solid transparent;
    border-radius:99px; padding:6px 15px; margin-right:-15px; cursor:pointer;
  }
  .forms button:hover{color:#B21236}
  .forms button.is-active{border-color:var(--line); background:var(--pill)}

  .headline{position:absolute; left:36px; bottom:34px; z-index:4}
  .headline h1{font-family:Archivo,sans-serif; font-weight:900; font-size:clamp(58px,9.2vw,148px); line-height:.94; letter-spacing:-.015em}
  .headline .row{display:flex; align-items:flex-end; gap:30px}
  .headline p{font-size:19px; line-height:1.4; color:var(--muted); max-width:290px; padding-bottom:16px}
  .badge{
    position:absolute; right:24px; bottom:24px; z-index:5; display:flex; align-items:center; gap:9px;
    background:#3c3a38; color:#f2f0ea; font-size:14.5px; padding:10px 18px; border-radius:99px;
  }
  .badge i{width:9px; height:9px; border-radius:50%; background:#FEB914; display:block}
  .sample-tag{position:absolute; left:36px; top:84px; z-index:5; font-size:12.5px; letter-spacing:.16em; color:#B21236; text-transform:uppercase}

  @media(max-width:760px){
    header{padding:16px 18px}
    .brand{font-size:18px}
    .controls{position:static; transform:none; margin-left:auto}
    .controls .pill{padding:8px 12px; font-size:13px}
    .controls [data-play]{display:none}
    .theme{display:none}
    .note-l,.note-r{display:none}
    .forms{right:18px; top:26%; gap:9px}
    .forms button{font-size:14px; padding:5px 11px; margin-right:-11px}
    .headline{left:18px; bottom:78px}
    .headline h1{font-size:56px}
    .headline p{display:none}
    .badge{right:14px; bottom:14px; font-size:12.5px; padding:8px 13px}
    .sample-tag{left:18px; top:70px}
  }
</style>
</head>
<body>

<div class="stage">
  <canvas data-cymatic aria-hidden="true"></canvas>

  <header>
    <div class="brand">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="4" r="2.2"/><circle cx="10" cy="4" r="2.2"/><circle cx="16" cy="4" r="2.2"/><circle cx="4" cy="10" r="2.2"/><circle cx="10" cy="10" r="2.2"/><circle cx="16" cy="10" r="2.2"/><circle cx="4" cy="16" r="2.2"/><circle cx="10" cy="16" r="2.2"/><circle cx="16" cy="16" r="2.2"/></svg>
      BREIZH
    </div>
    <nav class="controls" aria-label="Sculpture controls">
      <button class="pill" data-pulse>Pulse ∿</button>
      <button class="pill" data-pause>Pause Spin ❚❚</button>
      <button class="pill is-off" data-play>Play Spin ▷</button>
    </nav>
    <button class="pill theme" data-theme>◐&nbsp; Light / Dark</button>
  </header>

  <p class="sample-tag">Sample — hero concept</p>

  <p class="note-l">Move to shape.<br>Press to resonate.</p>
  <p class="note-r">Ten pastries.<br>Endless expression.</p>

  <nav class="forms" aria-label="Pastries">
    <button data-form class="is-active">Croissant</button>
    <button data-form>Baguette</button>
    <button data-form>Eclair</button>
    <button data-form>Macaron</button>
    <button data-form>Lemon Tart</button>
    <button data-form>Madeleine</button>
    <button data-form>Brioche</button>
    <button data-form>Galette</button>
    <button data-form>Mille-Feuille</button>
    <button data-form>Chouquette</button>
  </nav>

  <div class="headline">
    <h1>Golden.</h1>
    <div class="row">
      <h1>Alive.</h1>
      <p>Ten thousand golden crumbs.<br>One living pastry.</p>
    </div>
  </div>

  <p class="badge"><i></i> Made in-house · Café Breizh</p>
</div>

<script src="js/cymatic.js"></script>
</body>
</html>
